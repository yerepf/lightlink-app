<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141e12" />
    <title>Lunar Co-Visibility Explorer</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="viewport" class="viewport" aria-label="Vista tridimensional del terreno lunar"></div>

      <header class="app-header" id="app-header">
        <div class="app-header__brand">
          <span class="app-header__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M20.2 14.2A8.5 8.5 0 0 1 9.8 3.8a8.5 8.5 0 1 0 10.4 10.4Z" />
              <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <div>
            <h1>Lunar Co-Visibility Explorer</h1>
            <p class="app-header__subtitle" id="site-subtitle">Terreno LOLA · Efemérides JPL Horizons · Visualización geométrica</p>
          </div>
        </div>

        <div class="app-header__status">
          <span class="ui-badge" id="live-badge" role="status">
            <span class="ui-badge__dot" aria-hidden="true"></span>
            <span class="badge-live-text">Cargando</span>
          </span>
          <span class="ui-badge" id="dte-badge" aria-live="polite">
            <span class="ui-badge__dot" aria-hidden="true"></span>
            <span class="badge-dte-text">DTE: pendiente</span>
          </span>
          <span class="perf" id="perf" aria-label="Rendimiento">Midiendo FPS…</span>
          <button class="icon-button" id="status-toggle" type="button" aria-expanded="false" aria-controls="status-panel" aria-label="Mostrar estado y resultados">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round" />
            </svg>
          </button>
          <button class="icon-button" id="panel-toggle" type="button" aria-expanded="true" aria-controls="control-panel" aria-label="Ocultar controles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="control-panel" id="control-panel" data-open="true" aria-label="Controles de misión">
        <div class="control-panel__scroll" id="panel-sections"></div>
      </aside>

      <div class="panel-backdrop" id="panel-backdrop" hidden></div>

      <section class="status-panel ui-panel" id="status-panel" data-open="true" aria-label="Estado y resultados"></section>

      <div class="compass-mount" id="compass-mount"></div>

      <section class="timeline-mount" id="timeline-mount" aria-label="Línea de tiempo lunar"></section>

      <div class="toast" id="toast" role="alert" hidden>
        <p class="toast__message" id="error"></p>
        <div class="toast__actions">
          <button class="ui-btn ui-btn--danger ui-btn--sm" id="retry" type="button" hidden>Reintentar conexión</button>
        </div>
      </div>

      <div class="sr-only" id="live-region" role="status" aria-live="polite"></div>

      <noscript>
        <p style="padding: 24px">Esta aplicación necesita JavaScript para visualizar el terreno lunar.</p>
      </noscript>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
